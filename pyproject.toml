[project]
name = "studylens"
version = "1.0.0"
description = "Local-first hybrid retrieval and grounded study answers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "scikit-learn>=1.6,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6"]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
